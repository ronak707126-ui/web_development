 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        body{
            font-family: 'Times New Roman', Times, serif;
            text-align: center;
        }
        .piano{
            display: flex;
            justify-content: center;
            margin-top: 50px;
        }

        .key{
            border: 1px solid black;
            width: 50px;
            height: 200px;
            margin: 2px;
            background-color: white;
            box-shadow: 2px 2px 5px black;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Piano - Events</h1>

    <div class="piano">
                    <div class="key" data-note="A">A</div>
                    <div class="key" data-note="B">B</div>
                    <div class="key" data-note="C">C</div>
                    <div class="key" data-note="D">D</div>
                    <div class="key" data-note="E">E</div>
                    <div class="key" data-note="F">F</div>
                    <div class="key" data-note="G">G</div>
                    <div class="key" data-note="H">H</div>

    </div>

            <audio id="audio-A" src="dragon-studio-single-key-press-393908.mp3"></audio>
            <audio id="audio-B" src="freesound_community-1-note-piano-104171.mp3"></audio>
            <audio id="audio-C" src="freesound_community-la-80237.mp3"></audio>
            <audio id="audio-D" src="freesound_community-mi-80239.mp3"></audio>
            <audio id="audio-E" src="freesound_community-piano-g-6200.mp3"></audio>
            <audio id="audio-F" src="freesound_community-sol-101774.mp3"></audio>
            <audio id="audio-G" src="freesound_community-mi-80239 (1).mp3"></audio>
            <audio id="audio-H" src="u_df365hdxp7-cinematic-piano-note-362716.mp3"></audio>
    <script>
        const keys = document.querySelectorAll(".key")

        console.log(keys) // keys is the array which is used to store all the div containers
        keys.forEach( function(e){
            const note = e.getAttribute("data-note")

            const audio = document.getElementById("audio-" + note)

            //Action-click
            e.addEventListener('click',function(){
                audio.currentTime = 0;
                audio.play()
            })

            //mouse
            e.addEventListener('mouseover',function(){
                e.style.backgroundColor = "lightblue"
            })

             e.addEventListener('mouseout',function(){
                e.style.backgroundColor = "white"
            })


        }) // each data on array and do not one task
    </script>
</body>
</html>
