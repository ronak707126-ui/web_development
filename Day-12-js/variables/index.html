<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <script>

        //variable - it is a Box in which we store value
        //syntax - VariableType/Keyword VariableName=value

        //Variable will only store single value at a time
        //1. var keyword-Js Creates A variable

        var username = "ronak" //"text" - inside quotes
        console.log(username)

        var height = 5.9 // -Number - directly
        console.log("The Value of Height " , height)

        var country = "India"

        var country = "bharat"

        console.log(country)

        //Disadvantage of var is it allows you to use same VariableName

        //2. let keyword - you cannot use same variablName again

        let email = "abc@gamil.com"
        console.log(email)

        let fruit = "Mango"

        console.log(fruit)

        fruit = "Apple"

        console.log(fruit)

        //You can still Maniplating The Let

        //3. const keyword - Fixed , Cannot Been Changes

        const appName = "Watsapp"

        // appName = "flipcart"
        console.log(appName)

    </script>
    
</body>
</html>
